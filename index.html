<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OSRS Boss Loot Simulator</title>
  <style>
    :root {
      --osrs-bg: #0e0c0a;
      --osrs-panel: #1e1812;
      --osrs-panel-header: #2c2219;
      --osrs-border: #4a3b2c;
      --osrs-border-light: #6e5943;
      --osrs-gold: #ff9800;
      --osrs-yellow: #ffeb3b;
      --osrs-green: #00ff00;
      --osrs-purple: #a335ee;
      --osrs-text: #e0d0b0;
      --osrs-text-dim: #9e8e78;
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--osrs-bg);
      color: var(--osrs-text);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 1100px;
      background: var(--osrs-panel);
      border: 3px solid var(--osrs-border);
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      overflow: hidden;
    }

    .header {
      background: var(--osrs-panel-header);
      padding: 15px 20px;
      border-bottom: 2px solid var(--osrs-border);
      text-align: center;
    }

    .header h1 {
      margin: 0;
      color: var(--osrs-gold);
      font-size: 26px;
      text-shadow: 2px 2px 4px #000;
      letter-spacing: 1px;
    }

    .header p {
      margin: 5px 0 0 0;
      font-size: 13px;
      color: var(--osrs-text-dim);
    }

    .control-panel {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      padding: 20px;
      background: rgba(0, 0, 0, 0.25);
      border-bottom: 2px solid var(--osrs-border);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 13px;
      font-weight: bold;
      color: var(--osrs-gold);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    select, input, button {
      background: #110d0a;
      color: #fff;
      border: 1px solid var(--osrs-border-light);
      padding: 10px 12px;
      border-radius: 4px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus, input:focus { border-color: var(--osrs-gold); }

    button {
      background: #4a2e12;
      color: var(--osrs-gold);
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.2s;
    }

    button:hover {
      background: #6e441b;
      color: #fff;
      border-color: var(--osrs-gold);
    }

    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      background: #0a0806;
      padding: 15px 20px;
      border-bottom: 2px solid var(--osrs-border);
      text-align: center;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stat-label {
      font-size: 12px;
      color: var(--osrs-text-dim);
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 18px;
      font-weight: bold;
      color: var(--osrs-green);
    }

    .content-area {
      padding: 20px;
      min-height: 350px;
    }

    .status-msg {
      text-align: center;
      padding: 40px;
      color: var(--osrs-text-dim);
      font-size: 16px;
    }

    .loot-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 12px;
    }

    .item-card {
      background: #120e0a;
      border: 1px solid var(--osrs-border);
      border-radius: 6px;
      padding: 10px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      text-align: center;
      transition: transform 0.1s, border-color 0.2s;
    }

    .item-card:hover {
      transform: translateY(-2px);
      border-color: var(--osrs-border-light);
    }

    .item-card.unique {
      border: 2px solid var(--osrs-gold);
      background: #281a0b;
    }

    .item-card.pet {
      border: 2px solid var(--osrs-purple);
      background: #210b28;
    }

    .item-qty {
      position: absolute;
      top: 4px;
      left: 6px;
      color: var(--osrs-yellow);
      font-weight: bold;
      font-size: 12px;
      text-shadow: 1px 1px 2px #000;
    }

    .item-icon {
      width: 44px;
      height: 44px;
      object-fit: contain;
      margin: 6px 0;
    }

    .item-name {
      font-size: 11px;
      line-height: 1.2;
      color: var(--osrs-text);
      word-break: break-word;
    }

    .secondary-log {
      margin-top: 25px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--osrs-border);
      border-radius: 6px;
      padding: 15px;
    }

    .secondary-log h3 {
      margin: 0 0 10px 0;
      color: var(--osrs-gold);
      font-size: 15px;
    }

    .log-list {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 13px;
      max-height: 150px;
      overflow-y: auto;
    }

    .log-list li {
      padding: 4px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <h1>OSRS Boss Loot Simulator</h1>
    <p>Simulate boss drops driven dynamically via external JSON database</p>
  </div>

  <div class="control-panel">
    <div class="form-group">
      <label for="bossSelect">Select Boss</label>
      <select id="bossSelect" disabled>
        <option>Loading boss database...</option>
      </select>
    </div>

    <div class="form-group">
      <label for="kcInput">Kill Count (KC)</label>
      <input type="number" id="kcInput" value="100" min="1" max="100000">
    </div>

    <div class="form-group" style="justify-content: flex-end;">
      <button id="simBtn" onclick="runSimulation()" disabled>Simulate Loot</button>
    </div>
  </div>

  <div class="stats-bar">
    <div class="stat-box">
      <span class="stat-label">Total Kills</span>
      <span id="statKc" class="stat-value">0</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">Total GE Value</span>
      <span id="statValue" class="stat-value">0 GP</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">Uniques Dropped</span>
      <span id="statUniques" class="stat-value">0</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">RNG Status</span>
      <span id="statLuck" class="stat-value" style="color: var(--osrs-gold);">-</span>
    </div>
  </div>

  <div class="content-area">
    <div id="statusArea" class="status-msg">Loading JSON boss data...</div>
    <div id="lootGrid" class="loot-grid" style="display: none;"></div>
    
    <div id="secLogBox" class="secondary-log" style="display: none;">
      <h3 id="secLogTitle">Secondary Roll Breakdown</h3>
      <ul id="secLogList" class="log-list"></ul>
    </div>
  </div>
</div>

<script>
let bossDatabase = {};

// Fetch decoupled JSON file on startup
async function loadBossData() {
  const statusArea = document.getElementById("statusArea");
  try {
    const response = await fetch('boss_data.json');
    if (!response.ok) {
      throw new Error("HTTP status: " + response.status);
    }
    bossDatabase = await response.json();
    populateBossDropdown();
    
    statusArea.innerText = "Select a boss and KC above, then click 'Simulate Loot'.";
  } catch (err) {
    console.error("Failed to load boss data:", err);
    statusArea.innerHTML = `<span style="color: #ff5555;">Error loading boss database (boss_data.json).<br>Make sure boss_data.json exists in the same folder.</span>`;
  }
}

function populateBossDropdown() {
  const select = document.getElementById("bossSelect");
  const btn = document.getElementById("simBtn");
  select.innerHTML = "";

  const bossKeys = Object.keys(bossDatabase);
  if (bossKeys.length === 0) {
    select.innerHTML = "<option>No bosses found</option>";
    return;
  }

  bossKeys.forEach(key => {
    const opt = document.createElement("option");
    opt.value = key;
    opt.textContent = bossDatabase[key].name;
    select.appendChild(opt);
  });

  select.disabled = false;
  btn.disabled = false;
}

function rollFromTable(table) {
  let rand = Math.random();
  let cumulative = 0;
  for (let item of table) {
    cumulative += item.rate;
    if (rand < cumulative) return item;
  }
  return null;
}

function runSimulation() {
  const bossKey = document.getElementById("bossSelect").value;
  const kc = parseInt(document.getElementById("kcInput").value) || 1;
  const boss = bossDatabase[bossKey];

  if (!boss) return;

  let inventory = {};
  let totalValue = 0;
  let totalUniques = 0;
  let secondaryEvents = [];
  let dt2Counter = 0;

  for (let k = 0; k < kc; k++) {
    // 1. Guaranteed Drops
    if (boss.guaranteed) {
      boss.guaranteed.forEach(item => {
        let q = Math.floor(Math.random() * (item.qty[1] - item.qty[0] + 1)) + item.qty[0];
        addLoot(inventory, item, q);
        totalValue += q * (item.value || 0);
      });
    }

    // 2. Primary Drops
    const rolls = boss.rollsPerKill || 1;
    for (let r = 0; r < rolls; r++) {
      let item = rollFromTable(boss.primaryTable || []);
      if (item) {
        // Handle Secondary Table Key (e.g., Unsired)
        if (item.secondaryKey && boss.secondaryTables && boss.secondaryTables[item.secondaryKey]) {
          let secItem = rollFromTable(boss.secondaryTables[item.secondaryKey]);
          if (secItem) {
            addLoot(inventory, secItem, 1);
            totalValue += secItem.value || 0;
            if (secItem.unique) totalUniques++;
            secondaryEvents.push(`Kill #${k + 1}: Rolled ${item.name} -> Awarded ${secItem.name}`);
          }
        }
        // Handle DT2 Invisible Counter Mechanics
        else if (item.dt2_vestige) {
          dt2Counter++;
          if (dt2Counter === 3) {
            addLoot(inventory, item, 1);
            totalValue += item.value || 0;
            totalUniques++;
            dt2Counter = 0;
            secondaryEvents.push(`Kill #${k + 1}: Completed 3/3 Vestige rolls -> Received ${item.name}!`);
          }
        }
        // Standard Drop
        else {
          let q = item.qty ? Math.floor(Math.random() * (item.qty[1] - item.qty[0] + 1)) + item.qty[0] : 1;
          addLoot(inventory, item, q);
          totalValue += q * (item.value || 0);
          if (item.unique) totalUniques++;
        }
      }
    }
  }

  renderResults(inventory, kc, totalValue, totalUniques, secondaryEvents);
}

function addLoot(inv, item, qty) {
  if (!inv[item.id]) {
    inv[item.id] = { ...item, count: 0 };
  }
  inv[item.id].count += qty;
}

function renderResults(inv, kc, totalValue, totalUniques, secondaryEvents) {
  document.getElementById("statusArea").style.display = "none";
  const lootGrid = document.getElementById("lootGrid");
  const secLogBox = document.getElementById("secLogBox");
  const secLogList = document.getElementById("secLogList");

  // Stats
  document.getElementById("statKc").innerText = kc.toLocaleString();
  document.getElementById("statValue").innerText = totalValue.toLocaleString() + " GP";
  document.getElementById("statUniques").innerText = totalUniques;

  // Luck heuristic
  const luckElem = document.getElementById("statLuck");
  if (totalUniques === 0) {
    luckElem.innerText = "Dry";
    luckElem.style.color = "#ff5555";
  } else {
    luckElem.innerText = "Lucky / On Rate";
    luckElem.style.color = "#00ff00";
  }

  // Grid
  lootGrid.innerHTML = "";
  lootGrid.style.display = "grid";

  Object.values(inv).forEach(item => {
    const card = document.createElement("div");
    card.className = `item-card ${item.unique ? 'unique' : ''} ${item.pet ? 'pet' : ''}`;
    
    card.innerHTML = `
      <span class="item-qty">${formatQty(item.count)}</span>
      <img class="item-icon" src="${item.icon}" alt="${item.name}" onerror="this.src='https://oldschool.runescape.wiki/images/Coins_detail.png'">
      <span class="item-name">${item.name}</span>
    `;
    lootGrid.appendChild(card);
  });

  // Secondary log
  if (secondaryEvents.length > 0) {
    secLogBox.style.display = "block";
    secLogList.innerHTML = secondaryEvents.map(e => `<li>${e}</li>`).join("");
  } else {
    secLogBox.style.display = "none";
  }
}

function formatQty(num) {
  if (num >= 10000000) return Math.floor(num / 1000000) + 'M';
  if (num >= 100000) return Math.floor(num / 1000) + 'K';
  return num.toLocaleString();
}

window.addEventListener("DOMContentLoaded", loadBossData);
</script>
</body>
</html>
